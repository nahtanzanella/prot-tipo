<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Provas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Sistema de Provas</h1>
        <h2>"Guarde e revise as suas provas"</h2>
    </header>

    <main>
        <div class="topo-sessao">
            <h1>Suas provas</h1>
            <button class="btn-adicionar" onclick="abrirModal()">+ Adicionar Prova</button>
        </div>

        <div class="container-provas" id="containerProvas">
            <div class="bloconotas">
                <h3>Matéria: Matemática</h3> 
                <p><strong>Nome do(a) aluno(a):</strong> Max Verstappen</p>
                <p><strong>Nota:</strong> 8.5</p>
                <p><strong>Data:</strong> 23/11/2026</p>
                <p><strong>Turma:</strong> 3 ano do ensino médio</p>
                <p><strong>Nome do(a) professor(a):</strong> Lulatron Pingareactor</p>
                <div class="grupo-botoes">
                    <button class="btn-acessar-imagem" onclick="visualizarImagem('aa.png')">Acessar Imagem da Prova</button>
                    <button class="btn-acessar" onclick="alert('Botão provisório')">Acessar Prova</button>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modalAviso">
        <div class="modal">
            <h3>Nova Prova</h3>
            <div class="campo">
                <label for="materia">Matéria:</label>
                <input type="text" id="materia" placeholder="Ex: História">
            </div>
            <div class="campo">
                <label for="Nome">Nome do(a) aluno(a):</label>
                <input type="text" id="nome">
            </div>
            <div class="campo">
                <label for="nota">Nota do Aluno:</label>
                <input type="number" id="nota" step="0.1" min="0" max="10" placeholder="Ex: 9.5">
            </div>
            <div class="campo">
                <label for="data">Data:</label>
                <input type="date" id="data">
            </div>
            <div class="campo">
                <label for="Turma">Turma:</label>
                <input type="text" id="serie">
            </div>
            <div class="campo">
                <label for="nomeprof">Nome do(a) professor(a):</label>
                <input type="text" id="nomeprof">
            </div>
            <div class="campo">
                <label for="foto">Foto da Prova (Opcional):</label>
                <input type="file" id="foto" accept="image/*">
            </div>
            <div class="modal-botoes">
                <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button class="btn-salvar" onclick="salvarProva()">Salvar Prova</button>
            </div>
        </div>
    </div>

    <div class="visualizador-overlay" id="visualizadorImagem">
        <div class="visualizador-conteudo">
            <img id="imagemExpandida" src="" alt="Imagem da prova">
            <button class="btn-fechar-imagem" onclick="fecharVisualizador()">X</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
